name: Raven Smart Life verification
on:
  push:
    branches:
      - feature/raven-smart-life-2026-11-26
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
