name: Raven Smart Life verification
on:
  push:
    branches:
      - feature/raven-smart-life-2026-11-26
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # This Raven baseline has no committed package-lock yet; generate it for CI only.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:security
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
