name: Raven rescue verification

on:
  push:
    branches:
      - rescue/unified-arena-integration-2026-11-03
  pull_request:
    branches:
      - main
      - rescue/unified-arena-integration-2026-11-03

permissions:
  contents: read

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rescue branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js application
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Run security policy unit tests
        run: npm run test:security
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Run Platform browser and responsive checks
        run: npm run test:e2e
